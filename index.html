<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ISEE Trainer">
<meta name="theme-color" content="#1B4F72">
<title>Brinton's ISEE Trainer</title>
<style>
:root{--navy:#1B4F72;--mid:#7FB3D5;--light:#D5E8F0;--cream:#F8F9F9;--gray:#2C3E50;--green:#27AE60;--red:#E74C3C;--gold:#F39C12}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--cream);color:var(--gray);padding-bottom:40px}
header{background:var(--navy);color:#fff;padding:14px 16px;padding-top:calc(14px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;cursor:pointer}
.streak{font-size:15px;font-weight:600}
main{padding:16px;max-width:560px;margin:0 auto}
.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
button{font-family:inherit;font-size:16px;border:0;border-radius:12px;padding:14px 16px;width:100%;margin:6px 0;cursor:pointer;text-align:left;transition:transform .08s;color:var(--gray)}
button:active{transform:scale(.98)}
.mode{background:var(--light);color:var(--navy);font-weight:600;font-size:17px}
.mode small{display:block;font-weight:400;font-size:13px;color:var(--gray);margin-top:3px}
.primary{background:var(--navy);color:#fff;text-align:center;font-weight:600}
.secondary{background:#fff;color:var(--navy);border:2px solid var(--mid);text-align:center;font-weight:600}
.choice{background:var(--cream);border:2px solid var(--light)}
.choice.correct{background:#E9F7EF;border-color:var(--green);color:#1E8449;font-weight:600}
.choice.wrong{background:#FDEDEC;border-color:var(--red);color:#C0392B}
.choice:disabled{opacity:.9}
.tag{display:inline-block;background:var(--light);color:var(--navy);font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;margin-bottom:10px}
.q{font-size:18px;line-height:1.45;margin:6px 0 14px}
.passage{font-size:16px;line-height:1.6;background:var(--cream);padding:14px;border-radius:10px;margin-bottom:14px;max-height:42vh;overflow:auto}
.explain{background:var(--light);border-radius:10px;padding:14px;margin-top:12px;line-height:1.5;font-size:15px}
.explain a{color:var(--navy);font-weight:600}
.feedback{font-size:21px;font-weight:700;margin:8px 0}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--light);border-radius:10px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--navy)}
.stat span{font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:var(--gold);color:#fff;padding:12px 20px;border-radius:999px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.2);opacity:0;transition:opacity .3s;pointer-events:none;z-index:9;white-space:nowrap}
.toast.show{opacity:1}
textarea{width:100%;min-height:130px;font-family:inherit;font-size:16px;padding:12px;border-radius:10px;border:2px solid var(--light);margin:8px 0}
ul{padding-left:20px;line-height:1.6;margin:6px 0}
.row{display:flex;gap:8px}
.muted{color:#7f8c8d;font-size:13px}
.qc{background:var(--cream);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:16px}
</style>
</head>
<body>
<header><h1 onclick="home()">Brinton's ISEE Trainer</h1><div class="streak" id="hdr"></div></header>
<main id="app"><div class="card">Loading…</div></main>
<div class="toast" id="toast"></div>
<script>
/* ================= KHAN ACADEMY TOPIC PAGES (stable topic-level links) ================= */
const KHAN={
 arithmetic:"https://www.khanacademy.org/math/arithmetic",
 fractions:"https://www.khanacademy.org/math/arithmetic/fraction-arithmetic",
 decimals:"https://www.khanacademy.org/math/arithmetic/arith-decimals",
 percents:"https://www.khanacademy.org/math/cc-sixth-grade-math/cc-6th-ratios-prop-topic",
 ratios:"https://www.khanacademy.org/math/cc-sixth-grade-math/cc-6th-ratios-prop-topic",
 negatives:"https://www.khanacademy.org/math/cc-seventh-grade-math/cc-7th-negative-numbers-add-and-subtract",
 order:"https://www.khanacademy.org/math/pre-algebra",
 equations:"https://www.khanacademy.org/math/cc-seventh-grade-math/cc-7th-equations-and-inequalities",
 expressions:"https://www.khanacademy.org/math/cc-seventh-grade-math/cc-7th-variables-expressions",
 geometry:"https://www.khanacademy.org/math/cc-seventh-grade-math/cc-7th-geometry",
 area:"https://www.khanacademy.org/math/basic-geo",
 stats:"https://www.khanacademy.org/math/cc-sixth-grade-math/cc-6th-data-statistics",
 exponents:"https://www.khanacademy.org/math/pre-algebra",
 factors:"https://www.khanacademy.org/math/cc-sixth-grade-math/cc-6th-factors-and-multiples",
 probability:"https://www.khanacademy.org/math/cc-seventh-grade-math/cc-7th-probability-statistics",
 patterns:"https://www.khanacademy.org/math/pre-algebra",
 pythagorean:"https://www.khanacademy.org/math/cc-eighth-grade-math/cc-8th-geometry"
};
/* ================= GENERATOR WORD BANKS ================= */
const VOCAB=[
["abundant","existing in large amounts"],["adversary","an enemy or opponent"],["ambiguous","unclear; having more than one possible meaning"],["amiable","friendly and pleasant"],["arid","very dry"],["benevolent","kind and generous"],["brevity","shortness; being brief"],["candid","honest and direct"],["coherent","logical and clear"],["concise","short and to the point"],["conspicuous","easy to notice"],["credible","believable"],["deceptive","misleading"],["diligent","hardworking and careful"],["diminish","to make or become smaller"],["docile","calm and easy to control"],["dormant","inactive, as if asleep"],["elated","extremely happy"],["eloquent","speaking clearly and persuasively"],["elusive","hard to catch or find"],["emulate","to imitate someone you admire"],["evident","clearly seen; obvious"],["exuberant","full of energy and excitement"],["feasible","possible to do"],["frugal","careful with money; thrifty"],["futile","pointless; having no chance of success"],["gregarious","sociable; enjoys being with others"],["hostile","unfriendly; aggressive"],["impartial","fair; not taking sides"],["indifferent","not caring one way or the other"],["inevitable","certain to happen"],["jovial","cheerful and good-humored"],["lenient","not strict; tolerant"],["lucid","clear and easy to understand"],["meager","small in amount; not enough"],["meticulous","extremely careful about details"],["naive","lacking experience; too trusting"],["notorious","famous for something bad"],["novice","a beginner"],["obscure","not well known; hard to understand"],["obstinate","stubborn"],["ominous","threatening; suggesting something bad will happen"],["opulent","rich and luxurious"],["perilous","dangerous"],["plausible","seeming reasonable or believable"],["prudent","wise and careful"],["reluctant","unwilling; hesitant"],["resilient","able to recover quickly from difficulty"],["scarce","in short supply"],["serene","calm and peaceful"],["skeptical","doubtful; not easily convinced"],["somber","dark and gloomy; serious"],["tedious","boring and long"],["tenacious","persistent; not giving up"],["timid","shy; easily frightened"],["tranquil","peaceful and quiet"],["trivial","of little importance"],["verbose","using more words than needed"],["vigilant","watchful and alert"],["zealous","full of passionate enthusiasm"],
["anecdote","a short, personal story","n"],["catastrophe","a sudden, terrible disaster","n"],["dilemma","a hard choice between two options","n"],["replica","an exact copy","n"],["remedy","a cure or solution","n"],
["deter","to discourage someone from acting","v"],["allocate","to hand out for a specific purpose","v"],["procrastinate","to put off doing something","v"],["scrutinize","to examine very closely","v"],["alleviate","to make pain or trouble less severe","v"]
];
/* part of speech for the few non-adjectives; everything else is an adjective */
const POS={adversary:"n",brevity:"n",novice:"n",diminish:"v",emulate:"v"};
VOCAB.forEach(v=>{v[2]=v[2]||POS[v[0]]||"a"});
/* words close enough in meaning that they must never appear together as answer + distractor */
const SAME=[["serene","tranquil"],["meager","scarce"],["lucid","coherent","evident"],["credible","plausible"],["prudent","diligent","meticulous","vigilant"],["obstinate","tenacious"],["reluctant","timid"],["elated","jovial","exuberant","zealous"],["amiable","gregarious","jovial"],["ambiguous","obscure"],["perilous","ominous","somber"],["diminish","alleviate"],["futile","trivial"],["candid","credible"]];
function related(a,b){return SAME.some(g=>g.includes(a)&&g.includes(b))}
/* ISEE-style synonyms: [TARGET, meaning, correct answers, wrong choices incl. look-alike traps]. No wrong word is a synonym. */
const SYN=[
["ELATED","extremely happy",["overjoyed","thrilled"],["elevated","gloomy","delayed","related"]],
["OBSTINATE","stubborn; refusing to change your mind",["stubborn","headstrong"],["obvious","flexible","obedient","gentle"]],
["PERILOUS","full of danger",["dangerous","hazardous"],["precious","secure","perfect","harmless"]],
["WARY","watchful and cautious",["cautious","watchful"],["weary","careless","reckless","trusting"]],
["FRUGAL","careful not to waste money",["thrifty","economical"],["fragile","wasteful","fruitful","generous"]],
["LUCID","clear and easy to understand",["clear","understandable"],["lucky","confusing","liquid","murky"]],
["TIMID","shy and easily frightened",["shy","fearful"],["timely","bold","daring","tiny"]],
["DILIGENT","hardworking and careful",["hardworking","industrious"],["delicate","lazy","careless","delightful"]],
["CANDID","honest and direct",["frank","honest"],["sweet","secretive","deceitful","sly"]],
["SERENE","calm and peaceful",["tranquil","peaceful"],["frantic","agitated","severe","noisy"]],
["SCARCE","in short supply",["rare","limited"],["scared","plentiful","abundant","common"]],
["PRUDENT","wise and careful",["sensible","wise"],["proud","reckless","foolish","rude"]],
["VIVID","bright and lifelike",["bright","lifelike"],["dull","faded","vague","pale"]],
["HOSTILE","unfriendly and aggressive",["unfriendly","antagonistic"],["hospitable","friendly","welcoming","gentle"]],
["TEDIOUS","long and boring",["boring","monotonous"],["exciting","thrilling","tidy","brief"]],
["FUTILE","having no chance of success",["useless","pointless"],["fertile","effective","useful","worthwhile"]],
["LENIENT","not strict; forgiving",["tolerant","merciful"],["strict","harsh","leaning","severe"]],
["JOVIAL","cheerful and good-humored",["cheerful","merry"],["jealous","gloomy","sullen","grumpy"]],
["ADVERSARY","an enemy or opponent",["opponent","rival"],["ally","partner","advertiser","supporter"]],
["NOVICE","a beginner",["beginner","newcomer"],["expert","veteran","novel","master"]],
["METICULOUS","extremely careful about details",["thorough","precise"],["careless","sloppy","hasty","miraculous"]],
["ZEALOUS","full of passionate enthusiasm",["passionate","enthusiastic"],["jealous","apathetic","indifferent","lazy"]],
["RESILIENT","able to bounce back from difficulty",["tough","adaptable"],["fragile","silent","brittle","weak"]],
["OMINOUS","suggesting something bad will happen",["threatening","menacing"],["promising","hopeful","cheerful","enormous"]],
["TRANQUIL","calm and quiet",["calm","still"],["turbulent","chaotic","noisy","restless"]]
];
const TRAPS=["elevated","weary","fragile","lucky","timely","delicate","hospitable","fertile","jealous","novel","precious","scared","proud","obvious","leaning","advertiser","miraculous"];
/* ================= STATE (saved on this phone) ================= */
const LS="brinton_isee_v1";
let S;try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
S=Object.assign({xp:0,streak:0,lastDay:null,best:0,sec:{verbal:[0,0],math:[0,0],reading:[0,0]},misses:[],seen:[]},S||{});
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function dayStr(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function touchStreak(){const t=dayStr(new Date());if(S.lastDay===t)return;const y=dayStr(new Date(Date.now()-864e5));S.streak=(S.lastDay===y)?S.streak+1:1;S.best=Math.max(S.best,S.streak);S.lastDay=t;save();toast(S.streak>1?"🔥 "+S.streak+"-day streak!":"🔥 Streak started!")}
function hdr(){document.getElementById("hdr").textContent="🔥 "+S.streak+"   ⭐ "+S.xp}
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2000)}
let BANK={verbal:[],math:[],reading:[],essay:[]};
let session={};
const app=document.getElementById("app");
/* ================= HELPERS ================= */
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[ri(0,a.length-1)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);return b?gcd(b,a%b):a}
function frac(n,d){const g=gcd(n,d);n/=g;d/=g;return d===1?String(n):n+"/"+d}
function fmt(x){return Number.isInteger(x)?String(x):String(Math.round(x*100)/100)}
function finish(answer,wrongs){ // unique 4 choices, answer guaranteed present once
 const a=String(answer);let out=[a];
 for(const w of wrongs){const s=String(w);if(!out.includes(s))out.push(s)}
 let k=1;const fm=a.match(/^(-?\d+)\/(\d+)$/);
 while(out.length<4){let s;const n=Number(a);
  if(fm)s=frac(Number(fm[1])+k,Number(fm[2]));else if(!isNaN(n))s=fmt(n+k*3);else s=a+" ("+k+")";
  if(!out.includes(s))out.push(s);k++}
 return shuffle(out.slice(0,4));
}
/* ================= GENERATORS ================= */
function genVocab(){
 if(Math.random()<0.5){
  const w=pick(VOCAB);
  const pool=VOCAB.filter(v=>v!==w&&v[2]===w[2]&&!related(v[0],w[0]));
  const wrong=shuffle(pool).slice(0,3).map(v=>v[1]);
  return {type:"verbal",sub:"Vocabulary",q:"What does <b>"+w[0]+"</b> mean?",choices:finish(w[1],wrong),answer:w[1],
   explain:"<b>"+w[0]+"</b> means <i>"+w[1]+"</i>. Try using it in a sentence today."}
 }
 const s=pick(SYN);const ans=pick(s[2]);const wrong=shuffle(s[3]).slice(0,3);
 const trap=wrong.find(x=>TRAPS.includes(x));
 const others=s[2].filter(x=>x!==ans);
 return {type:"verbal",sub:"Synonyms",q:"Which word is closest in meaning to <b>"+s[0]+"</b>?",choices:finish(ans,wrong),answer:ans,
  explain:"<b>"+s[0].toLowerCase()+"</b> means <i>"+s[1]+"</i>, so <b>"+ans+"</b> is closest."+(others.length?" Another synonym: "+others.join(", ")+".":"")+(trap?" Watch out: <b>"+trap+"</b> looks or sounds similar but means something different.":"")}
}
function genMath(){
 const kind=ri(1,10);let q,a,ex,k,w;
 if(kind===1){const x=ri(12,49),y=ri(12,49);a=x*y;const t=Math.floor(y/10)*10,o=y%10;
  q="What is "+x+" × "+y+"?";ex="Break "+y+" into "+t+" + "+o+". Then "+x+" × "+t+" = "+(x*t)+" and "+x+" × "+o+" = "+(x*o)+". Add: "+(x*t)+" + "+(x*o)+" = "+a+".";k="arithmetic";w=[a+x,a-y,a+10]}
 else if(kind===2){const d=ri(3,12),m=ri(6,25),r=ri(1,d-1);const n=d*m+r;
  q="What is the remainder when "+n+" is divided by "+d+"?";a=r;ex=d+" × "+m+" = "+(d*m)+", and "+n+" − "+(d*m)+" = "+r+". So the remainder is "+r+".";k="arithmetic";w=[m,r+1,d-r===r?r+2:d-r]}
 else if(kind===3){let d1,d2;do{d1=pick([2,3,4,5,6,8]);d2=pick([3,4,5,6,8,10])}while(d1===d2);
  const n1=ri(1,d1-1),n2=ri(1,d2-1);const L=d1*d2/gcd(d1,d2);const t1=n1*L/d1,t2=n2*L/d2;const num=t1+t2;
  a=frac(num,L);q="What is "+n1+"/"+d1+" + "+n2+"/"+d2+"? (Simplify.)";
  ex="Find a common denominator: "+L+". "+n1+"/"+d1+" = "+t1+"/"+L+" and "+n2+"/"+d2+" = "+t2+"/"+L+". Add the tops: "+num+"/"+L+(a!==num+"/"+L?", which simplifies to "+a:"")+". Never add the bottoms!";
  k="fractions";w=[frac(n1+n2,d1+d2),frac(n1*n2,d1*d2),frac(num+1,L)]}
 else if(kind===4){
  if(Math.random()<.5){const P=pick([40,60,80,120,160,200,240]);const p=pick([10,15,20,25,30,35,40]);const off=P*p/100;a=P-off;
   q="A jacket costs $"+P+". It's on sale for "+p+"% off. What is the sale price (in dollars)?";
   ex=p+"% of "+P+" = "+off+" (that's the discount). Subtract it: "+P+" − "+off+" = $"+a+".";k="percents";w=[off,P-p,P+off]}
  else{const y=pick([20,40,60,80]);const p=pick([5,15,35,45,55,65,85,95]);const x=y*p/100;a=p+"%";
   q=x+" is what percent of "+y+"?";ex="Percent = part ÷ whole × 100 = "+x+" ÷ "+y+" × 100 = "+p+"%.";k="percents";w=[(100-p)+"%",(p+10)+"%",(p-5)+"%"]}}
 else if(kind===5){const x=ri(2,12),b=ri(1,20),m=ri(2,9);const c=m*x+b;a=x;
  q="If "+m+"x + "+b+" = "+c+", what is x?";ex="Subtract "+b+" from both sides: "+m+"x = "+(c-b)+". Divide both sides by "+m+": x = "+x+". Check: "+m+" × "+x+" + "+b+" = "+c+". ✓";k="equations";w=[x+1,x-1,c-b]}
 else if(kind===6){const a1=ri(-15,-1),b1=ri(-12,12)||5;a=a1-b1;
  q="What is ("+a1+") − ("+b1+")?";ex="Subtracting a number is the same as adding its opposite: ("+a1+") + ("+(-b1)+") = "+a+".";k="negatives";w=[a1+b1,-a,a+2]}
 else if(kind===7){const wd=ri(3,15),h=ri(3,15);const isArea=Math.random()<.5;a=isArea?wd*h:2*(wd+h);
  q="A rectangle is "+wd+" cm long and "+h+" cm wide. What is its "+(isArea?"area":"perimeter")+"?";
  ex=isArea?"Area = length × width = "+wd+" × "+h+" = "+a+" square cm.":"Perimeter = 2 × (length + width) = 2 × ("+wd+" + "+h+") = "+a+" cm.";k="area";w=[isArea?2*(wd+h):wd*h,wd+h,a+wd]}
 else if(kind===8){const n=[ri(2,20),ri(2,20),ri(2,20),ri(2,20)];const s=n.reduce((x,y)=>x+y,0);a=fmt(s/4);
  q="What is the mean (average) of "+n.join(", ")+"?";ex="Add them: "+n.join(" + ")+" = "+s+". Divide by how many numbers there are (4): "+s+" ÷ 4 = "+a+".";k="stats";w=[s,Math.max(...n),fmt(s/4+1)]}
 else if(kind===9){
  if(Math.random()<.5){const b1=ri(2,6),e=ri(2,3);a=Math.pow(-b1,e);
   q="What is (−"+b1+")<sup>"+e+"</sup>?";ex="Multiply −"+b1+" by itself "+e+" times: "+Array(e).fill("(−"+b1+")").join(" × ")+" = "+a+". An "+(e%2?"odd":"even")+" number of negatives gives a "+(e%2?"negative":"positive")+" answer.";k="exponents";w=[-a,-b1*e,b1*e]}
  else{const c=ri(2,12),m=ri(2,5),b1=ri(2,6);a=c+m*b1*b1;
   q="What is "+c+" + "+m+" × "+b1+"<sup>2</sup>?";ex="Order of operations: exponent first ("+b1+"² = "+(b1*b1)+"), then multiply ("+m+" × "+(b1*b1)+" = "+(m*b1*b1)+"), then add: "+c+" + "+(m*b1*b1)+" = "+a+".";k="order";w=[(c+m)*b1*b1,c+m*b1*2,c+(m*b1)*(m*b1)]}}
 else {const r1=ri(2,6),r2=ri(2,7);const unit=ri(2,9);const total=(r1+r2)*unit;a=r2*unit;
  q="The ratio of cats to dogs at a shelter is "+r1+" : "+r2+". There are "+total+" animals in all. How many are dogs?";
  ex="Add the ratio parts: "+r1+" + "+r2+" = "+(r1+r2)+". Each part is "+total+" ÷ "+(r1+r2)+" = "+unit+" animals. Dogs = "+r2+" × "+unit+" = "+a+".";k="ratios";w=[r1*unit,a+unit,total-r2]}
 return {type:"math",sub:"Math practice",q:q,choices:finish(a,w),answer:String(a),explain:ex,khan:k};
}
/* ================= QUESTION SUPPLY ================= */
function freshFrom(list){const f=list.filter(q=>!S.seen.includes(q.id));return f.length?pick(f):null}
function nextQ(mode){
 if(mode==="review")return session.queue.shift()||null;
 if(mode==="reading")return freshFrom(BANK.reading);
 const type=mode==="mix"?(Math.random()<.5?"verbal":"math"):mode;
 if(Math.random()<.6){const b=freshFrom(BANK[type]);if(b)return b}
 return type==="verbal"?genVocab():genMath();
}
/* ================= SCREENS ================= */
function pct(a){return a[1]?Math.round(100*a[0]/a[1])+"%":"–"}
function home(){
 hdr();session={mode:null,answered:0,right:0,run:0,current:null,queue:[]};
 const v=S.sec.verbal,m=S.sec.math,r=S.sec.reading;
 const hr=new Date().getHours();const greet=hr<12?"Good morning":hr<17?"Hey":"Evening";
 app.innerHTML=`<div class="card"><div class="tag">${greet}, Brinton 👋</div>
 <p style="margin:0 0 10px">What do you want to train today?</p>
 <button class="mode" onclick="start('mix')">🎯 Mix it up<small>Verbal and math, shuffled</small></button>
 <button class="mode" onclick="start('math')">🔢 Just math<small>Quantitative reasoning and math achievement</small></button>
 <button class="mode" onclick="start('verbal')">📚 Just verbal<small>Synonyms, vocabulary, sentence completion</small></button>
 <button class="mode" onclick="start('reading')">📖 Reading comprehension<small>Short passages, 4 questions each</small></button>
 <button class="mode" onclick="essayMode()">✍️ Essay help<small>Prompt → sample outline → your outline</small></button>
 ${S.misses.length?`<button class="mode" onclick="startReview()">🔁 Review my misses<small>${S.misses.length} question${S.misses.length>1?"s":""} to win back</small></button>`:""}
 </div>
 <div class="card"><div class="stats">
 <div class="stat"><b>${S.streak}</b><span>day streak 🔥</span></div>
 <div class="stat"><b>${S.xp}</b><span>total XP ⭐</span></div>
 <div class="stat"><b>${pct(v)}</b><span>verbal · ${v[1]} done</span></div>
 <div class="stat"><b>${pct(m)}</b><span>math · ${m[1]} done</span></div>
 </div><p class="muted" style="text-align:center;margin:12px 0 0">Reading: ${pct(r)} · ${r[1]} done · Best streak: ${S.best} days</p></div>`;
}
function start(mode){touchStreak();session.mode=mode;ask()}
function startReview(){touchStreak();session.mode="review";session.queue=shuffle(S.misses);ask()}
function caughtUp(){
 const isReading=session.mode==="reading";
 app.innerHTML=`<div class="card"><p class="feedback">🎉 All caught up!</p>
 <p>${session.mode==="review"?"You've retried everything on your miss list. Nice work.":"You've finished every passage in the bank. New ones will show up when the question file is updated."}</p>
 ${isReading?`<button class="secondary" onclick="resetReading()">Redo all passages</button>`:""}
 <button class="primary" onclick="home()">Back home</button></div>`;
}
function resetReading(){const ids=BANK.reading.map(p=>p.id);S.seen=S.seen.filter(x=>!ids.includes(x));save();start("reading")}
function ask(){
 const q=nextQ(session.mode);session.current=q;
 if(!q){caughtUp();return}
 if(q.type==="reading"){readingScreen(q);return}
 app.innerHTML=`<div class="card"><div class="tag">${q.sub||q.type}${session.mode==="review"?" · retry":""}</div>
 <span class="muted" style="float:right">${session.right}/${session.answered} today</span>
 <div class="q">${q.q}</div>${q.qa?`<div class="qc"><b>Quantity A:</b> ${q.qa}</div><div class="qc"><b>Quantity B:</b> ${q.qb}</div>`:""}
 <div>${q.choices.map((c,i)=>`<button class="choice" data-i="${i}" onclick="answer(${i})">${c}</button>`).join("")}</div>
 <div id="after"></div></div>
 <button class="secondary" onclick="home()">End session</button>`;
}
function markChoices(q,i){
 const btns=document.querySelectorAll(".choice");
 btns.forEach((b,j)=>{b.disabled=true;if(String(q.choices[j])===String(q.answer))b.classList.add("correct")});
 const ok=String(q.choices[i])===String(q.answer);if(!ok)btns[i].classList.add("wrong");return ok;
}
function answer(i){
 const q=session.current;const ok=markChoices(q,i);
 session.answered++;const sec=S.sec[q.type]||S.sec.verbal;sec[1]++;
 if(ok){session.right++;session.run++;sec[0]++;S.xp+=10;
  if(session.run%5===0){S.xp+=20;toast("🔥 "+session.run+" in a row! +20 bonus")}
  if(session.mode==="review"){S.misses=S.misses.filter(m=>m.id!==q.id);toast("Won it back! 💪")}}
 else{session.run=0;if(!q.id)q.id="gen_"+Date.now();if(!S.misses.some(m=>m.id===q.id))S.misses.push(q);if(S.misses.length>150)S.misses.shift()}
 if(q.id&&!String(q.id).startsWith("gen_")&&!S.seen.includes(q.id))S.seen.push(q.id);
 save();hdr();
 const link=q.khan&&KHAN[q.khan]?`<p style="margin:10px 0 0"><a href="${KHAN[q.khan]}" target="_blank" rel="noopener">▶ Khan Academy lessons on this topic</a></p>`:"";
 document.getElementById("after").innerHTML=`<div class="feedback" style="color:${ok?"var(--green)":"var(--red)"}">${ok?pick(["Nailed it! ⭐ +10","Correct! 🎯 +10","Yes! 💥 +10","Boom. +10 XP"]):"Not quite. Answer: "+q.answer}</div>
 <div class="explain">${ok?"<b>Why:</b> ":""}${q.explain||""}${link}</div>
 <button class="primary" onclick="ask()">Next →</button>`;
 document.getElementById("after").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function readingScreen(p){
 let i=0,right=0;
 const render=()=>{const q=p.questions[i];session.rq=q;
  app.innerHTML=`<div class="card"><div class="tag">Reading · Question ${i+1} of ${p.questions.length}</div>
  <div class="passage"><b>${p.title}</b><br><br>${p.text}</div>
  <div class="q">${q.q}</div><div>${q.choices.map((c,j)=>`<button class="choice" onclick="rAnswer(${j})">${c}</button>`).join("")}</div><div id="after"></div></div>
  <button class="secondary" onclick="home()">End session</button>`};
 window.rAnswer=(j)=>{const q=session.rq;const ok=markChoices(q,j);
  S.sec.reading[1]++;if(ok){S.sec.reading[0]++;right++;S.xp+=10}save();hdr();
  const last=i===p.questions.length-1;
  document.getElementById("after").innerHTML=`<div class="feedback" style="color:${ok?"var(--green)":"var(--red)"}">${ok?"Correct! ⭐ +10":"Not quite. Answer: "+q.answer}</div>
  <div class="explain">${q.explain}</div>
  <button class="primary" onclick="${last?"rDone()":"rNext()"}">${last?"Finish passage":"Next question →"}</button>`;
  document.getElementById("after").scrollIntoView({behavior:"smooth",block:"nearest"})};
 window.rNext=()=>{i++;render()};
 window.rDone=()=>{if(!S.seen.includes(p.id))S.seen.push(p.id);
  if(right===p.questions.length){S.xp+=25;toast("📖 Perfect passage! +25")}else toast(right+"/"+p.questions.length+" on that passage");save();hdr();ask()};
 render();
}
let currentEssay=null;
function essayMode(){touchStreak();
 if(!BANK.essay.length){app.innerHTML=`<div class="card"><p>No essay prompts loaded yet. Check your connection.</p><button class="primary" onclick="home()">Home</button></div>`;return}
 const fresh=BANK.essay.filter(e=>!S.seen.includes(e.id));const e=fresh.length?pick(fresh):pick(BANK.essay);currentEssay=e;
 app.innerHTML=`<div class="card"><div class="tag">Essay practice</div>
 <p class="muted">On the ISEE you get 30 minutes to write on one prompt. It isn't scored, but your school reads it. They want a clear main point, specific examples, and a strong ending.</p>
 <div class="q"><b>Prompt:</b> ${e.prompt}</div>
 <p><b>Step 1.</b> See how one strong writer might plan it:</p>
 <div class="explain"><ul>${e.outline.map(b=>"<li>"+b+"</li>").join("")}</ul><p style="margin:8px 0 0"><b>Tip:</b> ${e.tip}</p></div>
 <p style="margin-top:16px"><b>Step 2. Your turn.</b> Plan your <i>own</i> answer in 3–5 bullets, using your own life and examples. One per line.</p>
 <textarea id="mine" placeholder="Main point:&#10;Example 1:&#10;Example 2:&#10;What I learned / why it matters:&#10;Closing line:"></textarea>
 <button class="primary" onclick="essayDone()">Done, check my plan</button></div>
 <button class="secondary" onclick="home()">Back home</button>`;
}
function essayDone(){const mine=document.getElementById("mine").value.trim();
 if(mine.split("\n").filter(l=>l.trim()).length<3){toast("Try for at least 3 bullets!");return}
 const e=currentEssay;if(!S.seen.includes(e.id))S.seen.push(e.id);S.xp+=15;save();hdr();
 app.innerHTML=`<div class="card"><div class="feedback" style="color:var(--green)">+15 XP for planning! ✍️</div>
 <p class="muted">${e.prompt}</p>
 <p><b>Your plan:</b></p><div class="explain" style="white-space:pre-wrap;background:#fff;border:2px solid var(--light)">${mine.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</div>
 <p><b>Check yourself:</b></p><ul>
 <li>Is your main point one clear sentence?</li><li>Do you have at least two <i>specific</i> examples (names, places, moments)?</li>
 <li>Do you explain <i>why</i> it matters or what you learned?</li><li>Does your last line connect back to your main point?</li></ul>
 <p class="muted">Want extra credit? Write the first paragraph for real in your notes app.</p>
 <div class="row"><button class="secondary" onclick="essayMode()">Another prompt</button><button class="primary" onclick="home()">Home</button></div></div>`;
}
/* ================= LOAD ================= */
async function load(){
 try{const r=await fetch("questions.json?v="+Date.now(),{cache:"no-store"});const j=await r.json();
  BANK={verbal:j.verbal||[],math:j.math||[],reading:j.reading||[],essay:j.essay||[]};
  BANK.verbal.forEach(q=>q.type="verbal");BANK.math.forEach(q=>q.type="math");BANK.reading.forEach(p=>{p.type="reading"});
 }catch(e){console.warn("questions.json not loaded; generators only",e)}
 home();
}
load();
</script>
</body>
